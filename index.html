<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Jailbreak Modded By: TopTech</title>
<style>
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .55; }
  }
  @keyframes scan {
    0% { background-position: 0 0; }
    100% { background-position: 0 40px; }
  }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #05080c;
    color: #b8c9d4;
    font: 15px/1.5 "Consolas", "Courier New", monospace;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      linear-gradient(rgba(0, 240, 255, .03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, .03) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, .12) 2px,
      rgba(0, 0, 0, .12) 4px
    );
    animation: scan 8s linear infinite;
  }
  #brand {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
    background: linear-gradient(180deg, #0a1218 0%, #070d12 100%);
    border-bottom: 1px solid #1a3a45;
    box-shadow: 0 1px 0 rgba(0, 240, 255, .15);
  }
  .brand-left { display: flex; align-items: center; gap: 10px; }
  #brand img {
    width: 30px; height: 30px; border-radius: 4px;
    border: 1px solid #1a4a55;
    vertical-align: middle;
  }
  #brand b {
    font-size: 16px; font-weight: 700; letter-spacing: .22em;
    text-transform: uppercase; color: #e8f7fc;
    text-shadow: 0 0 12px rgba(0, 240, 255, .35);
  }
  .brand-right {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    font-size: 12px; letter-spacing: .04em;
  }
  .brand-right a {
    color: #5eead4; text-decoration: none;
    border-bottom: 1px solid rgba(94, 234, 212, .25);
  }
  .brand-right a:hover { color: #a7f3d0; border-bottom-color: #5eead4; }
  .brand-right .sep { color: #1a3a45; }
  #wrap {
    position: relative; z-index: 1;
    padding: 22px 20px; max-width: 720px;
  }
  #state {
    font-size: 20px; font-weight: 700; margin: 0 0 10px;
    letter-spacing: .08em; text-transform: uppercase;
    color: #e8f7fc;
  }
  #state.warn { color: #f0d060; animation: pulse 1.6s ease-in-out infinite; }
  #det {
    font-size: 13px; color: #6b8494; margin: 0 0 6px;
    padding: 10px 12px;
    background: rgba(8, 18, 24, .85);
    border: 1px solid #1a3a45;
    border-left: 3px solid #00d4e8;
  }
  #det b { color: #5eead4; font-weight: 700; }
  #cache {
    font-size: 12px; color: #4a6070; margin: 0;
    letter-spacing: .06em; min-height: 16px;
  }
  #cache.cacheok { color: #34d399; }
  .ok { color: #34d399; }
  .bad { color: #f87171; }
  .warn { color: #f0d060; }
</style>
</head>
<body>
<div id="brand">
  <div class="brand-left">
    <img src="logo_raw.png" alt="" width="30" height="30"><b>TopTech</b>
  </div>
  <div class="brand-right">
    <a href="tel:+963935446807">+963935446807</a>
    <span class="sep">|</span>
    <a href="http://www.toptech.com.sy" target="_blank" rel="noopener">www.toptech.com.sy</a>
  </div>
</div>
<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    function go() { setState("loading " + bug + " chain...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
